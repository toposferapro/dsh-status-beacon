# dsh-status-beacon bundle patch
#
# Одна строка плагина на host-плоскости. name обязан совпадать с именем пакета:
# по нему client-modules находит package.json с объявлением dsh.client и отдаёт
# браузерную половину на /plugins/dsh-status-beacon/client.js.
- insert:
    - id: dsh-status-beacon
      name: 'dsh-status-beacon'
